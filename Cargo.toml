# powerlevel11k — Rust workspace

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
libc = "0.2"
git2 = "0.20"
portable-pty = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
