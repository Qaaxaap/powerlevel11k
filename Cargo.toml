# powerlevel11k — Rust workspace

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
libc = "0.2"
git2 = "0.21"
portable-pty = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# `bench` inherits `release`, so the strip setting above also strips the benchmark binary.
# iai-callgrind's `--toggle-collect` matches the wrapper function by name, and valgrind cannot
# resolve a stripped symbol: every metric then reads zero. Keep the symbols in the bench build;
# the release binaries stay stripped.
[profile.bench]
strip = false
