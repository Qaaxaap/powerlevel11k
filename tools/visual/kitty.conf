# kitty settings for the visual test. They are part of the reference: a change here changes the
# rendered pixels, so update the reference pictures in the same commit.
#
# The family comes from the font configuration the Nix wrapper exports through FONTCONFIG_FILE.
font_family Maple Mono NF
bold_font auto
italic_font auto
font_size 15
# Maple Mono NF has a tall ascent; the default line box clips the top of the first row. A
# relative line height keeps the whole glyph inside its cell and is part of the reference.
adjust_line_height 120%

# A blinking cursor makes two captures of the same screen differ; pin its shape and turn the
# blink off. The cursor is part of the reference frame.
cursor_blink no
cursor_shape block

# A small padding keeps the first line's glyphs off the capture edge (the line box starts at the
# window edge otherwise, and the top of tall glyphs is clipped) and leaves the screen readable
# around the prompt.
window_padding_width 12

# Pin the terminal colours so a change in kitty's defaults cannot move the reference frames.
background #000000
foreground #dddddd

# Only the first screen matters here; keep kitty's own UI out of the picture.
tab_bar_style hidden
confirm_os_window_close 0
