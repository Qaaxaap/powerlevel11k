# cargo-deny configuration, used by `just deny` and the CI `deny` job.
#
# The repository itself is GPL-3.0-or-later; the allow list covers that plus the licences the
# current dependency graph carries, so a new dependency with an unexpected licence fails the
# check instead of passing unnoticed.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "warn"
# Empty on purpose: git2 0.21 fixed RUSTSEC-2026-0183 and RUSTSEC-2026-0184, and gettext-rs
# 0.8 marks `setlocale` unsafe for RUSTSEC-2026-0244.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "GPL-3.0-or-later",
  "LGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
