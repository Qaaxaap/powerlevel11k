# git-cliff configuration, used by `just changelog`.
#
# The changelog is generated from Conventional Commits: the commit subject is the only thing
# a contributor has to get right for a change to appear here.

[changelog]
header = """
# Changelog

Notable changes, newest first. Generated from
[Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) by
`just changelog`.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (breaking){% endif %}
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^i18n", group = "Translations" },
  { message = "^style", group = "Style" },
  { message = "^chore", group = "Chores" },
  { message = ".*", group = "Other" },
]
