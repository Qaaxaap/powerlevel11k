[package]
name = "p11k-xtask"
description = "Build and release tasks for p11k"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { workspace = true }
flate2 = "1"
goblin = "0.10"
hex = "0.4"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
xshell = "0.2"

[dev-dependencies]
# `assemble` is tested against a temporary directory laid out like the CI download.
tempfile = "3"
