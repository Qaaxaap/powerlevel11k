[package]
name = "p11k-engine"
description = "p11k engine: pty host that proxies a theme-less shell and draws the themed prompt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "p11k"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
kdl = "6.5.0"
libc = { workspace = true }
p11k-gitstatus = { path = "../p11k-gitstatus" }
portable-pty = { workspace = true }
unicode-width = { workspace = true }

[build-dependencies]

[dev-dependencies]
# Integration tests: run the engine binary in a pty and assert the passthrough and the prompt
# output.
libc = { workspace = true }
portable-pty = { workspace = true }
