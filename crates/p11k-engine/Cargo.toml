[package]
name = "p11k-engine"
description = "p11k engine: pty host that proxies a theme-less shell and draws the themed prompt"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "p11k"
path = "src/main.rs"

# The Debian package. `depends` is checked against the build target by `cargo xtask dist`; the
# glibc floor must stay the one `crates/p11k-xtask/src/target.rs` builds against.
[package.metadata.deb]
name = "p11k"
maintainer = "Qaaxaap <Qaaxaap@users.noreply.github.com>"
copyright = "2026, Qaaxaap"
license-file = ["../../COPYING.LESSER", "0"]
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.17)"
extended-description = "p11k owns the terminal as a pty host and draws the prompt header while the shell keeps drawing the input line and announces when a prompt is ready."
assets = [
  ["target/release/p11k", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/p11k/README.md", "644"],
  ["../../COPYING", "usr/share/doc/p11k/COPYING", "644"],
  ["../../COPYING.LESSER", "usr/share/doc/p11k/COPYING.LESSER", "644"],
]

# A musl build is static. `$auto` makes cargo-deb derive an empty dependency list from the
# binary instead of declaring a package it does not need.
[package.metadata.deb.variants.musl]
# The gnu package already owns `p11k`, so the musl build needs its own name. Without it the
# two packages cannot be installed together.
name = "p11k-musl"
depends = "$auto"

[dependencies]
anyhow = "1"
clap = { workspace = true }
fluent-templates = { workspace = true }
fluent-bundle = { workspace = true }
kdl = "6.5.0"
libc = { workspace = true }
p11k-gitstatus = { path = "../p11k-gitstatus" }
portable-pty = { workspace = true }
unicode-width = { workspace = true }
percent-encoding = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
jiff = { workspace = true }
strip-ansi-escapes = { workspace = true }
wait-timeout = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }


[dev-dependencies]
# Integration tests: run the engine binary in a pty and assert the passthrough and the prompt
# output.
insta = { workspace = true }
libc = { workspace = true }
portable-pty = { workspace = true }
