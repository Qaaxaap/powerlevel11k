[package]
name = "p11k-engine"
description = "p11k engine: pty host that proxies a theme-less shell and draws the themed prompt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "p11k"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = { workspace = true }
portable-pty = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# 集成测试：在 pty 里跑引擎二进制，断言透传与 prompt 输出。
libc = { workspace = true }
portable-pty = { workspace = true }
