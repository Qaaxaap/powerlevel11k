[package]
name = "p11k-gitstatus"
description = "Byte-compatible Rust reimplementation of the gitstatusd protocol and engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# 性能内核（openat/fstatat/fcntl/kill/getpgrp）需要 libc。
libc.workspace = true
# git 对象模型（HEAD/分支/远端/tag/stash/commit message/revwalk），
# 对应原版对 libgit2 的使用；性能内核（index 解析与扫描）在其上手工实现。
git2.workspace = true
# raw FFI：dirty diff 的 notify_cb/range_start/range_end（git2 未绑定），
# 对齐原版 StartDirtyScan 的区间优化。
libgit2-sys.workspace = true

[dev-dependencies]
# 性能基准（benches/）。性能契约要求与 C++ 原版对拍，基准是硬性门槛。
criterion = "0.5"
# 测试用临时目录。
tempfile = "3"
