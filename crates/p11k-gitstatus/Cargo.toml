[package]
name = "p11k-gitstatus"
description = "Byte-compatible Rust reimplementation of the gitstatusd protocol and engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The performance core (openat/fstatat/fcntl/kill/getpgrp) needs libc.
libc.workspace = true
# git object model (HEAD/branches/remotes/tags/stashes/commit messages/revwalk), matching the
# original's use of libgit2. The performance core (index parsing and scanning) sits on top of it,
# written by hand.
git2.workspace = true
log = "0.4.35"
env_logger = "0.11.11"
# Raw FFI: notify_cb/range_start/range_end for the dirty diff (git2 does not bind them),
# matching the original StartDirtyScan range optimization.

[dev-dependencies]
# Temporary directories for tests.
tempfile = "3"
