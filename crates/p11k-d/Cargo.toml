[package]
name = "p11k-d"
description = "p11k daemon: a gitstatusd-compatible backend first, then the full p11k engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "p11k-d"
path = "src/main.rs"

[dependencies]
p11k-gitstatus = { path = "../p11k-gitstatus" }

[dev-dependencies]
# 集成测试用临时 git 仓库。
tempfile = "3"
