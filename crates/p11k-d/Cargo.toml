[package]
name = "p11k-d"
description = "p11k daemon: a gitstatusd-compatible backend first, then the full p11k engine"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "p11k-d"
path = "src/main.rs"

# The Debian package. `depends` is checked against the build target by `cargo xtask dist`.
[package.metadata.deb]
name = "p11k-d"
maintainer = "Qaaxaap <Qaaxaap@users.noreply.github.com>"
copyright = "2026, Qaaxaap"
license-file = ["../../COPYING.LESSER", "0"]
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.17)"
extended-description = "p11k-d is a byte-compatible gitstatusd replacement: the same protocol, the same responses, in Rust."
assets = [
  ["target/release/p11k-d", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/p11k-d/README.md", "644"],
  ["../../COPYING", "usr/share/doc/p11k-d/COPYING", "644"],
  ["../../COPYING.LESSER", "usr/share/doc/p11k-d/COPYING.LESSER", "644"],
]

# A musl build is static. `$auto` makes cargo-deb derive an empty dependency list from the
# binary instead of declaring a package it does not need.
[package.metadata.deb.variants.musl]
depends = "$auto"

[dependencies]
p11k-gitstatus = { path = "../p11k-gitstatus" }

[dev-dependencies]
# Temporary git repositories for the integration tests.
tempfile = "3"
# Repository fixtures with a fixed state, built with git2 for the differential tests.
git2 = { workspace = true }
