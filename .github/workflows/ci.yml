name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G

      - name: Format
        run: nix develop --command cargo fmt --all -- --check

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: nix develop --command cargo test --all --locked

      - name: Package
        run: |
          out=$(nix build --no-link --print-out-paths)
          for bin in p11k p11k-d; do
            test -x "$out/bin/$bin"
          done
          test -f "$out/share/locale/zh_CN/LC_MESSAGES/p11k.mo"
          grep -aq "$out/share/locale" "$out/bin/p11k"
          "$out/bin/p11k" --version
