name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G

      - name: Check
        run: nix develop --command just check

      - name: Dependency licences and advisories
        run: nix develop --command just deny

      - name: Spelling
        run: nix develop --command just spell

      - name: Flake check
        run: nix flake check

      - name: Package
        run: |
          out=$(nix build --no-link --print-out-paths)
          for bin in p11k p11k-d; do
            test -x "$out/bin/$bin"
          done
          test -f "$out/share/locale/zh_CN/LC_MESSAGES/p11k.mo"
          grep -aq "$out/share/locale" "$out/bin/p11k"
          "$out/bin/p11k" --version

  # The devShell pins this version, but a flake mistake could hide that. This job uses plain
  # rustup, so it fails on the real toolchain and not on a nix expression.
  msrv:
    name: MSRV 1.95.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Check
        run: cargo check --all-targets --locked
