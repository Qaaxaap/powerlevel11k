name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a push to a pull request branch and the pull_request event would otherwise
# start the same work twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Documentation-only changes should not wait for the full build. This job classifies the
  # change list with tools/ci/classify-changes.sh, and the heavy jobs below skip their steps
  # when the answer is `code=false`.
  #
  # The heavy jobs still start instead of using a job-level `if`. GitHub treats a skipped
  # required check as passing, so a skipped job would hide the check instead of reporting it;
  # a job whose steps are all skipped still reports success and keeps the check name.
  #
  # A failure in this job skips the heavy jobs through `needs`, and their skipped required
  # checks pass as well. Keep that in mind before a change to this job.
  #
  # Any error here means `code=true`: a misclassified change must run the full CI, not skip it.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -z "$BASE_SHA" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! paths=$(git diff --name-only "$BASE_SHA...HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$paths" | tools/ci/classify-changes.sh >> "$GITHUB_OUTPUT"

  # The whole lint set: formatting, nix formatting, clippy, typos, actionlint and zizmor. It
  # runs once, on one architecture, because none of it depends on the target.
  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        if: needs.changes.outputs.code == 'true'
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml', 'deny.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G
      - name: Cache cargo
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.arch }}-${{ runner.os }}-
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: nix develop --command just lint
      - name: Commit messages
        if: needs.changes.outputs.code == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: nix develop --command just commit-msg "$BASE_SHA..HEAD"
      - name: Dependency audit
        if: needs.changes.outputs.code == 'true'
        run: nix develop --command just deny

  test:
    name: test (${{ matrix.arch }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        if: needs.changes.outputs.code == 'true'
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          primary-key: nix-${{ matrix.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ matrix.arch }}-
          gc-max-store-size-linux: 3G
      - name: Cache cargo
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.arch }}-${{ runner.os }}-
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: nix develop --command just test
      # The diff against the original daemon is the compatibility promise; it needs the real
      # binary, which the devShell provides through GITSTATUSD_PATH.
      - name: Differential tests
        if: needs.changes.outputs.code == 'true'
        run: nix develop --command just differential

  # The devShell pins the toolchain, but a flake mistake could hide that. This job uses the
  # rustup toolchain the manifest names, so it fails on the real compiler and not on a nix
  # expression. It runs outside the devShell, whose `cargo` is not a rustup proxy.
  msrv:
    name: msrv
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        if: needs.changes.outputs.code == 'true'
      - name: Check
        if: needs.changes.outputs.code == 'true'
        run: nix shell --inputs-from . nixpkgs#just --command just msrv

  # The flake is the supported Nix install path. This job builds the package once, instead of
  # repeating the same build on every architecture. The tests run in `just test`.
  nix:
    name: nix
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        if: needs.changes.outputs.code == 'true'
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G
      - name: Package
        if: needs.changes.outputs.code == 'true'
        run: nix develop --command just nix-verify

  # The render check runs p11k inside a real kitty terminal in a headless sway compositor and
  # compares the captured pixels with the committed reference frames. It is a job of its own
  # because the visual devShell is heavy and only this job needs it.
  render:
    name: render
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        if: needs.changes.outputs.code == 'true'
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: needs.changes.outputs.code == 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G
      - name: Cache cargo
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.arch }}-${{ runner.os }}-
      - name: Render check
        if: needs.changes.outputs.code == 'true'
        run: nix develop --command just render-check
      - name: Upload the captured frames and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: render-check
          path: .cache/render-check/
          retention-days: 7
