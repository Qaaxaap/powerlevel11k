name: Build

# Reusable build workflow. `release.yml` and `nightly.yml` call it, so the way a release binary
# is produced exists once.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-dist-${{ matrix.target }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-dist-${{ matrix.target }}-
          gc-max-store-size-linux: 3G
      # The build needs zig and cargo-zigbuild, both pinned in the flake, so it runs in the
      # devShell like every other task.
      - name: Build
        run: nix develop --command just dist ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: output-${{ matrix.target }}
          path: |
            target/dist/${{ matrix.target }}/*.tar.gz
            target/dist/${{ matrix.target }}/*.deb
            target/dist/${{ matrix.target }}/runtime-dependencies.md
          retention-days: 7
