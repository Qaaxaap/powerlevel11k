name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dispatch re-runs the pipeline for an existing tag, for example after a runner
  # outage. The tag input keeps the checkout on the tag rather than on a branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, such as v1.0.0-alpha.1"
        required: true
        type: string

# A tag is published once. A second dispatch on the same tag must not cancel the run that is
# already uploading artifacts, or the release is left half-uploaded.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      # No cache in this job: it publishes, and a cache a pull request can write to must not
      # decide what ends up in a release.
      - name: Check the tag against the manifest and the changelog
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: nix develop --command just release-check "$TAG"
      # A tag can point at a commit whose CI did not finish or pass. Check the required results
      # before any artifact is built.
      - name: Check the commit status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          sha=$(git rev-parse "$TAG^{commit}")
          for name in lint msrv nix render "test (x86_64)" "test (aarch64)"; do
            state=$(gh api "repos/$GH_REPO/commits/$sha/check-runs" \
              --jq ".check_runs[] | select(.name == \"$name\") | .conclusion" | tail -n 1)
            if [ "$state" != "success" ]; then
              echo "required check $name is '${state:-missing}' for $sha" >&2
              exit 1
            fi
          done

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    name: release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: target/dist
      # Assemble writes one SHA256SUMS and one runtime-dependencies.md for every target.
      - name: Assemble the artifacts
        run: nix shell --inputs-from . nixpkgs#just --command just assemble
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          # CHANGELOG.md is the single source for the release notes. git-cliff writes a version
          # section as `## <version> — <date>`. `release-check` already proved the section
          # exists, so the fallback is a safety net rather than the normal path.
          notes=$(mktemp)
          awk -v v="$version" '
            /^## / {
              if (keep) exit
              keep = ($2 == v)
              if (keep) next
            }
            keep { print }
          ' CHANGELOG.md > "$notes"
          args=("--title" "p11k $version")
          case "$version" in
            *-*) args+=("--prerelease") ;;
          esac
          if [ -s "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::CHANGELOG.md has no section for $version. Using the generated notes."
            args+=(--generate-notes)
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" \
            target/dist/SHA256SUMS \
            target/dist/runtime-dependencies.md \
            target/dist/output-*/*.tar.gz \
            target/dist/output-*/*.deb \
            --clobber
