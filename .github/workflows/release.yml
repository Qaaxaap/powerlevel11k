name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # The binaries link the container's glibc, so building on 22.04 keeps the minimum at 2.35
    # and the packages install on older distributions. The runner is only the host.
    container:
      image: ubuntu:22.04
    # A container job defaults to `sh` (dash here), which rejects the bash parameter expansion
    # the Stage step uses. Pin bash for every run step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          apt-get update
          apt-get install -y curl cmake pkg-config gettext
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          export P11K_LOCALEDIR=/usr/share/locale
          cargo build --release --locked

      - name: Stage
        run: |
          set -eu
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml ($version)" >&2
              exit 1
            fi
          fi
          arch=amd64
          deb_version="${version//-/\~}"
          tarball="p11k-$version-x86_64-linux"
          stage="$tarball"
          rm -rf "$stage" debroot
          mkdir -p "$stage/bin" "$stage/share/locale/zh_CN/LC_MESSAGES"
          cp target/release/p11k target/release/p11k-d "$stage/bin/"
          cp README.md README.zh.md COPYING COPYING.LESSER "$stage/"
          msgfmt -o "$stage/share/locale/zh_CN/LC_MESSAGES/p11k.mo" \
            crates/p11k-engine/po/zh_CN.po
          tar czf "$tarball.tar.gz" "$stage"

          root=debroot
          mkdir -p "$root/DEBIAN" "$root/usr/bin" \
            "$root/usr/share/locale/zh_CN/LC_MESSAGES" \
            "$root/usr/share/doc/p11k"
          cp target/release/p11k target/release/p11k-d "$root/usr/bin/"
          cp "$stage/share/locale/zh_CN/LC_MESSAGES/p11k.mo" \
            "$root/usr/share/locale/zh_CN/LC_MESSAGES/"
          gzip -9 -c README.md > "$root/usr/share/doc/p11k/README.md.gz"
          {
            echo "Package: p11k"
            echo "Version: $deb_version"
            echo "Architecture: $arch"
            echo "Maintainer: Qaaxaap <Qaaxaap@users.noreply.github.com>"
            echo "Homepage: https://github.com/Qaaxaap/powerlevel11k"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Depends: libc6 (>= 2.35), libgcc-s1"
            echo "Description: powerlevel10k-compatible prompt engine"
            echo " p11k owns the terminal as a pty host and draws the prompt header while"
            echo " the shell keeps drawing the input line and announces when a prompt is"
            echo " ready. It also ships p11k-d, a byte-compatible gitstatusd replacement."
          } > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "p11k_${deb_version}_${arch}.deb"

      - name: Collect runtime dependencies
        run: |
          set -eu
          {
            echo "# Runtime dependencies"
            echo
            echo "Generated by \`ldd\` from the release binaries. Use this list to check that a"
            echo "system has everything p11k needs at run time."
            echo
            for bin in p11k p11k-d; do
              echo "## $bin"
              echo
              echo '```'
              ldd "target/release/$bin"
              echo '```'
              echo
            done
          } > runtime-dependencies.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            p11k-*.tar.gz
            p11k_*.deb
            runtime-dependencies.md

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          # CHANGELOG.md is the single source for release notes. When the changelog has no
          # section for this tag yet (the tag was cut before `just changelog <tag>`), fall back
          # to the notes GitHub generates from the pull requests.
          notes=$(mktemp)
          awk -v v="$version" '
            /^## \[/ { keep = index($0, "[" v "]") > 0; if (keep) next }
            keep { print }
          ' CHANGELOG.md > "$notes"
          if [ -s "$notes" ]; then
            notes_flag="--notes-file $notes"
          else
            notes_flag="--generate-notes"
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "p11k $version" $prerelease $notes_flag
          fi
          gh release upload "$GITHUB_REF_NAME" p11k-*.tar.gz p11k_*.deb runtime-dependencies.md --clobber
